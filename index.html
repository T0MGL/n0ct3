    <!-- Preloader NOCTE. Inline a proposito: tiene que pintar con el primer byte
         del HTML, antes de que baje el bundle. Un preloader que vive en React
         aparece despues del JS, o sea justo despues de la ventana que deberia
         cubrir. -->
    <style>
      #npl {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #000;
      }

      #npl svg {
        width: min(40.7vw, 225px);
        height: auto;
        color: #fff;
      }

      /* NOCTE tiene cinco letras, o sea un centro exacto: la C. El pulso sale de
         ahi y se abre a los pares (O,T) y (N,E). Simetrico por construccion. */
      #npl .npl-g {
        opacity: 0.12;
        animation: npl-bloom 2400ms cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }
      #npl .npl-g[data-ring="1"] { animation-delay: 190ms; }
      #npl .npl-g[data-ring="2"] { animation-delay: 380ms; }

      @keyframes npl-bloom {
        0%   { opacity: 0.12; }
        14%  { opacity: 0.36; }
        28%  { opacity: 0.7; }
        42%  { opacity: 0.36; }
        56%, 100% { opacity: 0.12; }
      }

      /* La palabra entera, una segunda vez, apagada y encima del pulso.
         El resolve la enciende y punto: la capa de abajo nunca se interrumpe.

         Antes el resolve hacia `animation: none` sobre las letras que pulsaban.
         Cada letra estaba en un punto distinto del ciclo, asi que todas pegaban
         un tiron al valor base antes de subir. Eso era el trabon. Encendiendo
         una capa aparte no hay nada que cortar: es imposible que salte.

         Las cinco letras suben JUNTAS, sin delay por anillo. El pulso de abajo
         va en onda desde la C, asi que si el resolve tambien sale del centro la
         C queda fija mientras las puntas todavia estan bajando su ciclo: el
         final se lee como que la animacion termina en el medio. Subiendo en
         bloque el ultimo frame es la palabra entera, que es donde tiene que
         terminar. La curva es front-loaded a proposito: gana mas rapido de lo
         que el pulso decae, asi que ninguna letra se oscurece en el camino. */
      #npl .npl-s {
        opacity: 0;
        transition: opacity 620ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      #npl.is-resolving .npl-s { opacity: 1; }

      #npl.is-done { opacity: 0; pointer-events: none; transition: opacity 320ms ease-out; }

      html.npl-lock, html.npl-lock body { overflow: hidden; }

      @media (prefers-reduced-motion: reduce) {
        #npl .npl-g { animation: none; opacity: 0; }
        #npl .npl-s { opacity: 1; transition: none; }
      }
    </style>

    <script>
      (function () {
        var el = document.getElementById('npl');
        if (!el) return;
        var root = document.documentElement;

        // MIN: lo que dura una pasada completa de las tres barras. Por debajo de
        // esto el preloader es un parpadeo y molesta mas de lo que aporta.
        // CAP: tope duro. Si una imagen del hero tarda o falla, la pagina sale
        // igual. Un preloader que espera "a que cargue todo" sin techo es una
        // pantalla negra eterna esperando que pase.
        var MIN = 900, CAP = 1800, RESOLVE = 620, HOLD = 280, FADE = 320;
        var t0 = Date.now(), done = false;
        var SEEN = 'nocte-npl-seen';

        // La animacion cuesta 2,1 segundos de pantalla tapada antes de que se
        // vea la oferta. Vale la pena una vez, la primera, que es la que llega
        // del anuncio. El que vuelve del carrito, del WhatsApp o de una pestana
        // que dejo abierta ya la vio y solo esta esperando. Se marca por sesion
        // y no por dispositivo: manana vuelve a ser la primera vez.
        var seen = false;
        try { seen = sessionStorage.getItem(SEEN) === '1'; } catch (e) { seen = false; }

        if (seen) {
          // Sin lock y sin evento: React todavia no monto, asi que nadie
          // escucharia el dispatch. El dataset lo lee al montar (ver el efecto
          // del badge en Index.tsx), que es el camino que ya existia para
          // cuando el preloader termina antes que React.
          root.dataset.npl = 'done';
          el.remove();
          return;
        }

        root.classList.add('npl-lock');

        function finish() {
          if (done) return;
          done = true;
          setTimeout(function () {
            el.className = 'is-resolving';
            setTimeout(function () {
              el.className = 'is-resolving is-done';
              root.classList.remove('npl-lock');
              // La app espera esta senal para arrancar lo que tiene que ver el
              // cliente despierto (el badge de autoridad, por ejemplo). Contar
              // desde el mount de React es contar debajo de esta pantalla.
              root.dataset.npl = 'done';
              try { sessionStorage.setItem(SEEN, '1'); } catch (e) { /* modo privado */ }
              window.dispatchEvent(new Event('nocte:ready'));
              setTimeout(function () { el.remove(); }, FADE);
            }, RESOLVE + HOLD);
          }, Math.max(0, MIN - (Date.now() - t0)));
        }

        if (document.readyState === 'complete') finish();
        else window.addEventListener('load', finish);
        setTimeout(finish, CAP);
      })();
    </script>
