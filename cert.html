  <body>
    <div id="root"></div>

    <!-- Sin JavaScript la pagina no puede pintar las cifras, pero si tiene que
         entregar los documentos Y el contexto. Entregar los PDF pelados seria
         mandar a alguien a leer tres FAIL sin explicacion, que es exactamente
         lo que esta pagina existe para evitar. -->
    <noscript>
      <div class="mx-auto max-w-[38rem] px-5 py-10 text-foreground">
        <h1 class="text-2xl font-bold tracking-tighter">Reportes de transmitancia</h1>
        <p class="mt-3 text-sm leading-relaxed text-muted-foreground">
          Para ver las cifras de cada lente hace falta activar JavaScript. Los reportes
          completos en PDF se abren igual, y esto es lo que hay que saber antes de abrirlos.
        </p>

        <h2 class="mt-8 text-base font-bold tracking-tight">Quién hizo la medición</h2>
        <p class="mt-2 text-sm leading-relaxed text-muted-foreground">
          Los reportes del rojo y del naranja los firma Micro-Light Optics Co., Ltd. El del
          amarillo lo firma Linhai Tongda Optical Glasses Co., Ltd. Ninguno es un laboratorio
          acreditado, y ninguno de estos documentos es un certificado: son reportes de
          medición. Hay un ensayo en curso en Bureau Veritas bajo ISO/IEC 17025.
        </p>

        <h2 class="mt-8 text-base font-bold tracking-tight">Por qué los reportes dicen FAIL</h2>
        <p class="mt-2 text-sm leading-relaxed text-muted-foreground">
          Los del rojo y del naranja evalúan el lente contra normas de anteojos de sol. Lo que
          reprueban son requisitos de conducción: reconocer la señal verde y la azul de un
          semáforo, dejar pasar un mínimo de luz entre 475 y 650 nm, y llegar a la
          transmitancia luminosa del 75 % que esas normas piden para manejar de noche.
          Reprobar esos ítems es la definición del producto, no un defecto. NOCTE no es un
          anteojo de sol y no se maneja con estos lentes puestos.
        </p>
        <p class="mt-2 text-sm leading-relaxed text-muted-foreground">
          El reporte del amarillo no marca incumplimientos, pero se evaluó contra una edición
          anterior de la norma y contra menos ítems. Además marca 100 % de transmitancia en
          370 nm, entre dos puntos de 0 % y 1,230 %: es una lectura fallada del instrumento.
          Cae en el ultravioleta y no afecta las cifras de luz azul.
        </p>

        <h2 class="mt-8 text-base font-bold tracking-tight">Los reportes</h2>
